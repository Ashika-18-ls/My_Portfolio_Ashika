<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 550" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#6366f1;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.2" />
    </linearGradient>
  </defs>

  <!-- Glowing Silhouette -->
  <g transform="translate(75, 40)">
    <!-- Head -->
    <circle cx="100" cy="50" r="35" fill="url(#bodyGrad)"/>
    <!-- Torso -->
    <path d="M 60 100 L 140 100 L 125 240 L 75 240 Z" fill="url(#bodyGrad)"/>
    <!-- Arms -->
    <path d="M 55 105 L 35 210 L 50 215 L 65 125 Z" fill="url(#bodyGrad)"/>
    <path d="M 145 105 L 165 210 L 150 215 L 135 125 Z" fill="url(#bodyGrad)"/>
    <!-- Legs -->
    <path d="M 75 245 L 85 430 L 65 430 L 70 245 Z" fill="url(#bodyGrad)"/>
    <path d="M 125 245 L 115 430 L 135 430 L 130 245 Z" fill="url(#bodyGrad)"/>
  </g>

  <!-- Ground Lighting & Ambient Rays -->
  <ellipse cx="175" cy="500" rx="90" ry="15" fill="#06b6d4" opacity="0.3"/>
  <ellipse cx="175" cy="500" rx="50" ry="8" fill="#38bdf8" opacity="0.6"/>

  <text x="175" y="530" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">Drop full-body.png in public/images/</text>
</svg>
