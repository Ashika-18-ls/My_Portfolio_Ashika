<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#6366f1;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  <rect width="400" height="500" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Subtle Circuit Lines -->
  <path d="M 50 100 L 120 100 L 150 130" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,4" fill="none" opacity="0.4"/>
  <circle cx="150" cy="130" r="3" fill="#06b6d4" opacity="0.6"/>
  <path d="M 350 150 L 280 150 L 250 180" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,4" fill="none" opacity="0.4"/>
  <circle cx="250" cy="180" r="3" fill="#8b5cf6" opacity="0.6"/>

  <!-- Glowing Silhouette Icon -->
  <g transform="translate(100, 110)">
    <circle cx="100" cy="80" r="55" fill="url(#grad1)" opacity="0.85"/>
    <path d="M 15 260 C 15 175, 185 175, 185 260 Z" fill="url(#grad1)" opacity="0.85"/>
  </g>
  
  <!-- Text Label -->
  <text x="200" y="420" fill="#f8fafc" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">Ashika L S</text>
  <text x="200" y="445" fill="#38bdf8" font-family="monospace" font-size="12" text-anchor="middle">B.E ECE • Hardware &amp; AI</text>
  <text x="200" y="475" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="middle">Drop profile.png in public/images/</text>
</svg>
